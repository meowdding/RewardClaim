[versions]

# Minecraft
minecraft = "26.1"
loom = "1.15-SNAPSHOT"
loader = "0.18.4"

# Dependencies
fabric = "0.145.0+26.1"
fabrickotlin = "1.13.9+kotlin.2.3.10"
hypixelapi = "1.0.2+build.1+mc26.1"
olympus = "1.8.0"
rlib = "4.0.0"

# Dev Dependencies
devauth = "1.2.2"
modmenu = "18.0.0-alpha.6"

[libraries]

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
loader = { module = "net.fabricmc:fabric-loader", version.ref = "loader" }
fabric = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric" }
fabrickotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabrickotlin" }
hypixelapi = { module = "maven.modrinth:hypixel-mod-api", version.ref = "hypixelapi" }
modapi = { module = "net.hypixel:mod-api", version = "1.0.2" }
olympus = { module = "earth.terrarium.olympus:olympus-fabric-26.1", version.ref = "olympus" }
rlib = { module = "com.teamresourceful.resourcefullib:resourcefullib-fabric-26.1", version.ref = "rlib" }

devauth = { module = "me.djtheredstoner:DevAuth-fabric", version.ref = "devauth" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }

[plugins]

loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
